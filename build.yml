name: Build Light Meter APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          echo "" | base64 -d | tar xz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LightMeter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LightMeter-APK
          path: LightMeter.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Light Meter build ${{ github.run_number }}
          files: LightMeter.apk
